<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A World the Size of Grief</title>
<meta name="description" content="A short, quiet game in five chapters about loss: one room that grows into an open world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0e100f;
    --bone: #ede9e2;
  }
  html { height: 100%; box-sizing: border-box; background: var(--ink); }
  body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; width: 100%; height: 100%; outline: none; }
  #game:focus { outline: none; }
  body.keys #game:focus { outline: 2px solid #d6ba93; outline-offset: -2px; }
  .noscript {
    font: 18px Georgia, serif;
    padding-block: 40px;
    padding-inline: 24px;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="A World the Size of Grief. A game played with the mouse, touch, or keyboard."></canvas>
<noscript><p class="noscript">This game needs JavaScript to run.</p></noscript>
<script src="js/core.js"></script>
<script src="js/paint.js"></script>
<script src="js/person.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/world.js"></script>
<script src="js/scenes.js"></script>
<script src="js/chapters/denial.js"></script>
<script src="js/chapters/anger.js"></script>
<script src="js/chapters/bargaining.js"></script>
<script src="js/chapters/depression.js"></script>
<script src="js/chapters/acceptance.js"></script>
<script src="js/main.js"></script>
</body>
</html>
