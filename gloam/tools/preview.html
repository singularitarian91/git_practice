<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Model Preview</title>
<style>
  html, body { margin: 0; background: #1b1d22; overflow: hidden; font-family: sans-serif; }
  .lbl { position: absolute; color: #e8dcc0; font-size: 11px; transform: translate(-50%, 0);
         background: rgba(0,0,0,.55); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body>
<script type="module">
// Lays out every top-level node of a .glb in a grid and renders it with the
// game's materials.  URL params: file, names (comma list), cols, yaw, pitch, size.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { applyGameMaterials } from '../src/engine/materials.js';

const q = new URLSearchParams(location.search);
const files = (q.get('file') || '').split(',').filter(Boolean);
const only = q.get('names') ? q.get('names').split(',') : null;
const yaw = THREE.MathUtils.degToRad(Number(q.get('yaw') ?? 30));
const pitch = THREE.MathUtils.degToRad(Number(q.get('pitch') ?? 22));
const W = innerWidth, H = innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2e36);
scene.add(new THREE.HemisphereLight(0xb8c4d8, 0x3a3226, 1.3));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);

const loader = new GLTFLoader();
const roots = [];
for (const f of files) {
  const gltf = await loader.loadAsync('../' + f);
  for (const child of [...gltf.scene.children]) {
    if (only && !only.includes(child.name)) continue;
    applyGameMaterials(child);
    roots.push(child);
  }
}
if (only) roots.sort((a, b) => only.indexOf(a.name) - only.indexOf(b.name));

// grid layout, cell size from the largest footprint
const boxes = roots.map((r) => new THREE.Box3().setFromObject(r));
const sizes = boxes.map((b) => b.getSize(new THREE.Vector3()));
const cell = Math.max(1.2, ...sizes.map((s) => Math.max(s.x, s.z))) * 1.25;
const cols = Number(q.get('cols')) || Math.ceil(Math.sqrt(roots.length * 1.6));
const rows = Math.ceil(roots.length / cols);
const labels = [];
roots.forEach((r, i) => {
  const cx = (i % cols - (cols - 1) / 2) * cell;
  const cz = (Math.floor(i / cols) - (rows - 1) / 2) * cell;
  r.position.x += cx; r.position.z += cz;
  scene.add(r);
  const el = document.createElement('div');
  el.className = 'lbl';
  const tris = (() => { let t = 0; r.traverse((o) => { if (o.isMesh) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return t; })();
  el.textContent = `${r.name}  (${Math.round(tris)}▲, ${sizes[i].y.toFixed(2)}m)`;
  document.body.appendChild(el);
  labels.push({ el, pos: new THREE.Vector3(cx, 0, cz) });
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(cols * cell + 4, rows * cell + 4),
  new THREE.MeshStandardMaterial({ color: 0x3b4034, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
// 1m reference grid
const grid = new THREE.GridHelper(Math.max(cols, rows) * cell + 4, Math.round(Math.max(cols, rows) * cell + 4), 0x555a50, 0x464a42);
grid.position.y = 0.002; scene.add(grid);

const maxH = Math.max(1, ...sizes.map((s) => s.y));
const span = Math.max(cols * cell, rows * cell * 1.1, maxH * 1.6);
const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 2000);
const dist = span * 1.25 + 2;
camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist + maxH * 0.4, Math.cos(yaw) * Math.cos(pitch) * dist);
camera.lookAt(0, maxH * 0.35, 0);
sun.position.set(span * 0.6, span * 1.2, span * 0.8);
const sc = sun.shadow.camera; sc.left = sc.bottom = -span; sc.right = sc.top = span; sc.far = span * 4; sc.updateProjectionMatrix();

renderer.render(scene, camera);
for (const l of labels) {
  const p = l.pos.clone().project(camera);
  l.el.style.left = ((p.x + 1) / 2 * W) + 'px';
  l.el.style.top = ((1 - p.y) / 2 * H + 6) + 'px';
}
window.__ready = true;
</script>
</body>
</html>
