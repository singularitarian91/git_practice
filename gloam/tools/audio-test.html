<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gloam Audio Test</title>
<style>
  :root {
    --bg: #15171c; --panel: #1f232a; --panel2: #262b33; --line: #343a44;
    --text: #e8dcc0; --dim: #9b937f; --ember: #e0873a; --ember2: #f2b35e; --frost: #8fb3c9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { font-size: 18px; margin: 0 8px 0 0; letter-spacing: .5px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; padding: 14px 16px 40px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  section.wide { grid-column: 1 / -1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--ember); }
  button.on { background: var(--ember); color: #1a1208; border-color: var(--ember2); }
  button.big { font-size: 15px; padding: 8px 16px; background: var(--ember); color: #1a1208; border-color: var(--ember2); font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .group { margin-bottom: 10px; }
  .group b { display: block; font-size: 12px; color: var(--dim); font-weight: 500; margin-bottom: 4px; }
  label.row { display: grid; grid-template-columns: 80px 1fr 40px; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  label.row span:last-child { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--ember); }
  input[type=text] { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
  #meter { width: 220px; height: 14px; background: var(--panel2); border-radius: 3px; position: relative; overflow: hidden; border: 1px solid var(--line); }
  #meterFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #5f9e6e, var(--ember2) 75%, #d9534f); }
  #meterPeak { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; left: 0; }
  #stats { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  #pad { width: 100%; max-width: 320px; aspect-ratio: 1; background: var(--panel2); border-radius: 6px; border: 1px solid var(--line); display: block; cursor: crosshair; touch-action: none; }
  .note { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  #log { color: #e79a8f; font-size: 12px; white-space: pre-wrap; }
  @media (max-width: 480px) { main { padding: 12px 16px 32px; } #meter { width: 140px; } }
</style>
</head>
<body>
<header>
  <h1>Gloam · Audio</h1>
  <button class="big" id="start">Start audio</button>
  <button id="suspend">Suspend</button>
  <button id="resume">Resume</button>
  <div id="meter" title="output RMS (bar) and peak (line)"><div id="meterFill"></div><div id="meterPeak"></div></div>
  <span id="stats">not started</span>
</header>
<main>
  <section>
    <h2>Volumes</h2>
    <div id="volumes"></div>
  </section>

  <section>
    <h2>Music</h2>
    <div class="grid" id="moods"></div>
    <p class="note">Moods crossfade. Combat/boss cut in fast; victory plays a fanfare, then settles.</p>
  </section>

  <section>
    <h2>Ambience</h2>
    <div id="amb"></div>
    <div class="grid" style="margin-top:8px">
      <button id="thunderBtn">Thunder</button>
      <label class="row" style="flex:1;grid-template-columns:70px 1fr 40px"><span>intensity</span><input type="range" id="thunderI" min="0.1" max="1.5" step="0.05" value="1"><span id="thunderIV">1</span></label>
    </div>
  </section>

  <section>
    <h2>Voices</h2>
    <input type="text" id="sayText" value="Well met, traveller! The mist is thick tonight... will you keep the fires lit?">
    <div class="grid" id="voices" style="margin-top:8px"></div>
    <div class="grid" style="margin-top:8px"><button id="stopSpeak">Stop</button><span class="note" id="speakState"></span></div>
  </section>

  <section>
    <h2>Listener &amp; position</h2>
    <canvas id="pad" width="320" height="320"></canvas>
    <label class="row"><span>spatial</span><input type="checkbox" id="spatial"><span></span></label>
    <label class="row"><span>yaw</span><input type="range" id="yaw" min="-3.1416" max="3.1416" step="0.01" value="0"><span id="yawV">0</span></label>
    <label class="row"><span>pitch</span><input type="range" id="pitch" min="0.5" max="2" step="0.01" value="1"><span id="pitchV">1</span></label>
    <label class="row"><span>variation</span><input type="checkbox" id="variation" checked><span></span></label>
    <p class="note">Click the pad to place the sound (±30 m). The listener sits in the centre; the arrow is its facing (yaw 0 = north, up).</p>
  </section>

  <section class="wide">
    <h2>Sound effects</h2>
    <div id="sfx"></div>
    <div class="grid" style="margin-top:8px"><button id="burst">Burst: every sfx at once</button><button id="steps">Walk loop (grass)</button></div>
    <div id="log"></div>
  </section>
</main>

<script type="module">
import { audio, VOICES, SFX_NAMES, MUSIC_MOODS, AMBIENCE_LAYERS } from '../src/engine/audio.js';
window.audio = audio;
window.VOICES = VOICES;
window.SFX_NAMES = SFX_NAMES;
window.MUSIC_MOODS = MUSIC_MOODS;
window.AMBIENCE_LAYERS = AMBIENCE_LAYERS;

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, text = '') => Object.assign(document.createElement(tag), props, text ? { textContent: text } : {});
const logErr = (msg) => { $('log').textContent += msg + '\n'; };
window.addEventListener('error', (e) => logErr(String(e.message)));

// start (init must happen inside a user gesture)
$('start').onclick = () => { audio.init(); $('start').textContent = 'Audio on'; };
$('suspend').onclick = () => audio.suspend();
$('resume').onclick = () => audio.resume();

// volumes
const VOL_DEFAULTS = { master: 0.8, music: 0.5, sfx: 0.8, ambience: 0.6, voice: 0.7 };
for (const [k, v] of Object.entries(VOL_DEFAULTS)) {
  const row = el('label', { className: 'row' });
  const out = el('span', {}, v.toFixed(2));
  const input = el('input', { type: 'range', min: 0, max: 1, step: 0.01, value: v });
  input.oninput = () => { out.textContent = (+input.value).toFixed(2); audio.setVolumes({ [k]: +input.value }); };
  row.append(el('span', {}, k), input, out);
  $('volumes').append(row);
}

// music
for (const m of MUSIC_MOODS) {
  const b = el('button', {}, m);
  b.onclick = () => {
    audio.init();
    audio.setMusic(m);
    for (const x of $('moods').children) x.classList.toggle('on', x === b && m !== 'none');
  };
  $('moods').append(b);
}

// ambience
const ambLevels = {};
for (const k of AMBIENCE_LAYERS) {
  const row = el('label', { className: 'row' });
  const out = el('span', {}, '0');
  const input = el('input', { type: 'range', min: 0, max: 1, step: 0.01, value: 0 });
  input.oninput = () => { ambLevels[k] = +input.value; out.textContent = (+input.value).toFixed(2); audio.init(); audio.setAmbience({ [k]: +input.value }); };
  row.append(el('span', {}, k), input, out);
  $('amb').append(row);
}
$('thunderI').oninput = () => { $('thunderIV').textContent = $('thunderI').value; };
$('thunderBtn').onclick = () => { audio.init(); audio.thunder(+$('thunderI').value); };

// voices
let current = null;
for (const v of Object.keys(VOICES)) {
  const b = el('button', {}, v);
  b.onclick = () => {
    audio.init();
    current = audio.speak($('sayText').value, v);
    $('speakState').textContent = 'speaking (' + v + ')…';
    const mine = current;
    current.done.then(() => { if (current === mine) $('speakState').textContent = 'done'; });
  };
  $('voices').append(b);
}
$('stopSpeak').onclick = () => audio.stopSpeak();

// listener pad: centre = listener, click to place the source
const pad = $('pad'), g = pad.getContext('2d');
const RANGE = 30;
let src = { x: 6, z: -6 };
function drawPad() {
  const w = pad.width, h = pad.height, s = w / (2 * RANGE);
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#343a44';
  for (let r = 6; r <= RANGE; r += 6) { g.beginPath(); g.arc(w / 2, h / 2, r * s, 0, Math.PI * 2); g.stroke(); }
  const yaw = +$('yaw').value;
  // listener arrow: yaw 0 faces -Z (up on the pad); positive yaw turns left
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  g.strokeStyle = '#8fb3c9'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w / 2, h / 2); g.lineTo(w / 2 + fx * 18, h / 2 + fz * 18); g.stroke();
  g.fillStyle = '#8fb3c9'; g.beginPath(); g.arc(w / 2, h / 2, 5, 0, Math.PI * 2); g.fill();
  g.fillStyle = $('spatial').checked ? '#e0873a' : '#6b645a';
  g.beginPath(); g.arc(w / 2 + src.x * s, h / 2 + src.z * s, 7, 0, Math.PI * 2); g.fill();
  g.lineWidth = 1;
}
pad.addEventListener('pointerdown', (e) => {
  const r = pad.getBoundingClientRect();
  src = { x: ((e.clientX - r.left) / r.width - 0.5) * 2 * RANGE, z: ((e.clientY - r.top) / r.height - 0.5) * 2 * RANGE };
  $('spatial').checked = true;
  drawPad();
});
$('yaw').oninput = () => { $('yawV').textContent = (+$('yaw').value).toFixed(2); audio.setListener(0, 0, +$('yaw').value); drawPad(); };
$('pitch').oninput = () => { $('pitchV').textContent = (+$('pitch').value).toFixed(2); };
$('spatial').onchange = drawPad;
drawPad();

// sfx buttons, grouped
const GROUPS = [
  ['Footsteps', /^step_/], ['Tools & gathering', /^(swing|chop|tree_fall|pick_stone|rock_break|hoe|water_pour|plant|harvest|dig)$/],
  ['Items & shop', /^(pickup|drop|coin|buy|sell|eat|drink|gift|chest_open|chest_close|place|remove|craft|cook|door)$/],
  ['UI', /^ui_/], ['Combat', /^(hit_enemy|hit_wood|enemy_die|player_hurt|player_die|block|dodge)$/],
  ['Fishing & bugs', /^(cast|bite|reel|fish_catch|fish_escape|splash|net_swing|bug_catch|relic_found)$/],
  ['Village & rewards', /^(sleep|day_start|friendship|quest_complete|offering|hearth_roar|fire_ignite|levelup|notify)$/],
  ['Creatures & weather', /^(gloam_spawn|wraith_scream|gloamling_growl|draugr_groan|stag_roar|crow_caw|owl_hoot|deer_flee|thunder)$/],
];
const opts = () => {
  const o = { pitch: +$('pitch').value, variation: $('variation').checked };
  if ($('spatial').checked) { o.x = src.x; o.z = src.z; }
  return o;
};
const placed = new Set();
for (const [title, re] of GROUPS) {
  const box = el('div', { className: 'group' });
  const grid = el('div', { className: 'grid' });
  for (const n of SFX_NAMES.filter((x) => re.test(x))) {
    const b = el('button', {}, n);
    b.onclick = () => { audio.init(); audio.sfx(n, opts()); };
    b.onmouseenter = () => audio.sfx('ui_hover');
    grid.append(b);
    placed.add(n);
  }
  box.append(el('b', {}, title), grid);
  $('sfx').append(box);
}
const rest = SFX_NAMES.filter((n) => !placed.has(n));
if (rest.length) {
  const grid = el('div', { className: 'grid' });
  for (const n of rest) { const b = el('button', {}, n); b.onclick = () => { audio.init(); audio.sfx(n, opts()); }; grid.append(b); }
  $('sfx').append(el('b', {}, 'Other'), grid);
}
$('burst').onclick = () => { audio.init(); for (const n of SFX_NAMES) audio.sfx(n, opts()); };
let walking = null;
$('steps').onclick = () => {
  audio.init();
  if (walking) { clearInterval(walking); walking = null; $('steps').classList.remove('on'); return; }
  $('steps').classList.add('on');
  walking = setInterval(() => audio.sfx('step_grass', opts()), 380);
};

// frame loop: drive the scheduler and the meter
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  audio.update(dt);
  const st = audio._debugStats();
  const rmsDb = st.rms > 0 ? 20 * Math.log10(st.rms) : -120, pkDb = st.peak > 0 ? 20 * Math.log10(st.peak) : -120;
  const pos = (db) => Math.max(0, Math.min(1, (db + 60) / 60)) * 100 + '%';
  $('meterFill').style.width = pos(rmsDb);
  $('meterPeak').style.left = pos(pkDb);
  $('stats').textContent = audio.ready
    ? `${st.state} · rms ${rmsDb.toFixed(0)} dB · peak ${pkDb.toFixed(0)} dB · sfx voices ${st.voices} · mood ${st.mood} · layers ${st.layers.join(',') || '-'}`
    : (st.state === 'none' ? 'not started' : st.state);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
</script>
</body>
</html>
